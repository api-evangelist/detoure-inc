name: Detoure Inc
description: 'Detoure Inc (DETOURE) is a sustainable fashion resale marketplace, backed
  by 500 Global, that sources highly curated clothing from influencers and tastemakers
  and offers it to shoppers at thrift prices. The platform lets customers buy current
  trends from the creators they follow while cutting down on excess fashion waste,
  and lets influencers and partners apply to consign and sell items from their own
  closets. Detoure operates as a consumer e-commerce brand on a hosted Shopify storefront
  and does not currently publish a public developer API, SDKs, or developer documentation.'
